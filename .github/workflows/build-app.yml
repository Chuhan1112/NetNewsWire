name: Build App

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Secrets Sources
        run: PROJECT_DIR="$GITHUB_WORKSPACE" ./buildscripts/updateSecrets.sh

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          # Debug rather than Release: the project has a Release-only build phase that
          # re-signs the Share Extension with ${EXPANDED_CODE_SIGN_IDENTITY}, which is
          # empty under the no-signing config this job uses, so Release cannot complete
          # in CI without a real signing identity.
          #
          # Warnings are errors in this project, and the Debug config fails any function
          # that takes more than 800ms to type-check. On a runner slower than a local
          # Mac an upstream function crosses that line, so this artifact build does not
          # treat warnings as errors. The CI workflow still enforces them.
          xcodebuild \
            -project NetNewsWire.xcodeproj \
            -scheme NetNewsWire \
            -configuration Debug \
            -xcconfig .github/macos-ci-no-signing.xcconfig \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            build

      - name: Ad-hoc sign
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug/NetNewsWire.app"
          # No certificate in CI, so ad-hoc sign: the app then launches with
          # Gatekeeper's right-click Open instead of being rejected outright.
          codesign --force --deep --sign - "$app" || echo "ad-hoc signing skipped"

      - name: Package
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/DerivedData/Build/Products/Debug"
          ditto -c -k --sequesterRsrc --keepParent NetNewsWire.app "$RUNNER_TEMP/NetNewsWire-macos.zip"
          ls -lh "$RUNNER_TEMP/NetNewsWire-macos.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: NetNewsWire-macos
          path: ${{ runner.temp }}/NetNewsWire-macos.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # One rolling release that every build refreshes, so the download link
          # stays stable instead of piling up a release per commit.
          tag_name: latest-build
          name: Latest build
          make_latest: true
          files: ${{ runner.temp }}/NetNewsWire-macos.zip
          body: |
            Automatic build of `main` at ${{ github.sha }}.

            This fork adds local-model translation on top of NetNewsWire: any
            OpenAI-compatible endpoint (oMLX, LM Studio, Ollama), automatic or manual
            translation, and timeline headline translation.

            Build notes:
            - arm64, ad-hoc signed and not notarized, so the first launch needs
              right-click → Open.
            - Built in the Debug configuration, which defines
              `SKIP_APP_GROUP_ACCESS`, so the app runs unsandboxed and keeps its
              library in `~/Library/Application Support/NetNewsWire` — the same
              place other unsandboxed (debug) builds use. It opens with whatever
              feeds are already there and never touches the signed release app's
              sandbox container.
            - That library is a real one, so back it up before large upstream
              merges. The Sync upstream workflow refuses to merge upstream code
              that does not compile.
